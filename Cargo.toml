[package]
name = "lrc_downloader"
version = "0.2.0"
license = "MIT"
edition = "2024"

[dependencies]
walkdir = "2.5"
lofty = "0.24"
directories = "5.0"

# Сеть и асинхронность
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Утилиты
anyhow = "1.0"
indicatif = "0.17"
clap = { version = "4.6.1", features = ["derive"] }
